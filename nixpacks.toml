# nixpacks.toml
# Tells Railway to install Python + pip packages alongside Node.js.
# requirements.txt is picked up automatically for pip installs.

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
    "npm install",
    "python3 -m pip install --upgrade pip",
    "python3 -m pip install -r requirements.txt"
]

[start]
cmd = "node src/server.js"
