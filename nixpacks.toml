# nixpacks.toml
# Force Node.js as the primary provider.
# Python + matplotlib installed as additional packages in the build phase.
# Do NOT add requirements.txt to the repo root — it confuses Railway
# into treating this as a Python project.

[providers]
nixpacks = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "python312", "python312Packages.matplotlib", "python312Packages.numpy"]

[phases.install]
cmds = ["npm install"]

[start]
cmd = "node src/server.js"
